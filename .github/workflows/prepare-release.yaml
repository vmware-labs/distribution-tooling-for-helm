name: Prepare release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (i.e. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  Prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Config Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Fetch Version
        run: echo "PLUGIN_VERSION=$(echo "$RELEASE_TAG" | tr -d 'v')" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Update Version
        run: |
          sed -i "s/version: \".*\"/version: \"$PLUGIN_VERSION\"/" plugin.yaml
          sed -i "s/var Version = \".*\"/var Version = \"$PLUGIN_VERSION\"/" cmd/dt/version.go
          git checkout -B "release/$PLUGIN_VERSION"
          git add plugin.yaml cmd/dt/version.go
          git commit -s -m "Prepare release $RELEASE_TAG"
          git push origin "release/$PLUGIN_VERSION"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Create PR
        run: gh pr create --fill --base main --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
